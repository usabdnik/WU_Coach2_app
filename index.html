        // Map month number to Russian month name
        function getMonthName(date) {
            const monthMap = {
                9: 'Сент', 10: 'Окт', 11: 'Нояб', 12: 'Дек',
                1: 'Янв', 2: 'Фев', 3: 'Мар', 4: 'Апр',
                5: 'Май', 6: 'Июн', 7: 'Июл', 8: 'Авг'
            };
            const d = new Date(date);
            return monthMap[d.getMonth() + 1];
        }

        // Map exercise name to field name
        function getExerciseFieldName(exerciseName) {
            if (exerciseName.includes('Подтяг')) return 'pullUps';
            if (exerciseName.includes('Отжимания от пола')) return 'pushUps';
            if (exerciseName.includes('брусьев')) return 'dips';
            return null;
        }

        // Transform Supabase athlete to PWA format
        function transformSupabaseAthlete(athlete, performances = []) {
            // Parse name (format: "Фамилия Имя" or just "Имя")
            const nameParts = athlete.name.trim().split(' ');
            const lastName = nameParts.length > 1 ? nameParts[0] : '';
            const firstName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : nameParts[0];

            // Build monthly performance records from performances table
            const monthlyPerformance = MONTHS.map(month => ({
                month: month,
                pullUps: 0,
                pushUps: 0,
                dips: 0
            }));

            // Group performances by month
            const records = { pullUps: {}, pushUps: {}, dips: {} };

            // Filter performances for this athlete and map to monthly records
            const athletePerformances = performances.filter(p => p.athlete_id === athlete.id);

            athletePerformances.forEach(perf => {
                const monthName = getMonthName(perf.recorded_at);
                const fieldName = getExerciseFieldName(perf.exercises?.name || '');

                if (monthName && fieldName) {
                    // Update monthly performance
                    const monthRecord = monthlyPerformance.find(m => m.month === monthName);
                    if (monthRecord) {
                        monthRecord[fieldName] = perf.value;
                    }

                    // Update records for max calculation
                    records[fieldName][monthName] = perf.value;
                }
            });

            return {
                id: athlete.id,
                lastName: lastName,
                firstName: firstName,
                name: athlete.name,
                group: athlete.group_name || null, // Allow null for athletes without assigned groups (don't default to AVAILABLE_GROUPS[0])
                schedule: athlete.schedule || '', // NEW: Schedule field (format: "Пн 18:00, Ср 19:00" OR "Самозапись")
                rank_start: athlete.rank_start || null, // NEW: Season start rank
                rank_end: athlete.rank_end || null, // NEW: Season end rank
                rank_history: athlete.rank_history || [], // NEW: Historical rank data (JSONB array)
                active: athlete.status === 'active' ? 'Да' : 'Нет',
                status: athlete.status,
                season: athlete.season || currentSeason?.name,
                performance: monthlyPerformance,
                records: records,
                created: athlete.created_at,
                updated: athlete.updated_at
            };
        }

        // Transform Supabase goal to PWA format
        function transformSupabaseGoal(goal, athleteName, exerciseName) {
            return {
                id: goal.id,
                studentId: goal.athlete_id,
                studentName: athleteName,
                exerciseId: goal.exercise_id,
                exerciseName: exerciseName,
                startDate: goal.start_date,
                setDate: goal.start_date, // Dual field support
                endDate: goal.end_date,
                completionDate: goal.completed ? goal.end_date : '',
                description: goal.description || '',
                notes: goal.description || '',
                status: goal.completed ? 'completed' : 'active',
                targetValue: goal.target_value,
                createdAt: goal.created_at,
                updatedAt: goal.updated_at
            };
        }

        // Sync with Supabase (NEW)
        async function syncWithSupabase() {
            const button = document.getElementById('syncBtn');

            // Check if SDK is still loading
            if (!window.supabaseSDKLoaded && !window.supabaseSDKFailed) {
                console.log('⏳ Supabase SDK еще загружается, ожидаем...');
                button.innerHTML = '<span class="sync-icon">⏳</span><span>Загрузка SDK...</span>';

                // Wait up to 10 seconds for SDK to load
                const maxWait = 10000;
                const startWait = Date.now();
                while (!window.supabaseSDKLoaded && !window.supabaseSDKFailed && (Date.now() - startWait) < maxWait) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                if (!window.supabaseSDKLoaded) {
                    console.warn('⚠️ Таймаут загрузки Supabase SDK');
                    button.classList.add('error');
                    button.innerHTML = '<span class="sync-icon">⏳</span><span>SDK не загрузился</span>';
                    setTimeout(() => {
                        button.classList.remove('error');
                        button.innerHTML = '<span class="sync-icon">🔄</span><span>Синхронизация</span>';
                    }, 3000);
                    return;
                }
            }

            // Re-initialize Supabase client if SDK loaded after page init (fix race condition)
            if (!supabaseClient && typeof window.supabase !== 'undefined') {
                try {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('✅ Supabase client инициализирован (delayed load)');
                } catch (e) {
                    console.warn('⚠️ Ошибка инициализации Supabase:', e);
                }
            }

            // Check if Supabase client is available (offline режим)
            if (!supabaseClient) {
                console.warn('📴 Синхронизация невозможна: Supabase недоступен (offline режим)');
                button.classList.add('error');
                button.innerHTML = '<span class="sync-icon">📴</span><span>Offline</span>';
                setTimeout(() => {
                    button.classList.remove('error');
                    button.innerHTML = '<span class="sync-icon">🔄</span><span>Синхронизация</span>';
                }, 3000);
                return;
            }

            // Prevent concurrent syncs
            if (button.classList.contains('syncing')) {
                console.log('⏳ Синхронизация уже идёт, пропускаем');
                return;
            }

            // Start syncing state
            button.classList.add('syncing');
            button.classList.remove('pending', 'success', 'error');
            button.disabled = true;
            button.innerHTML = '<span class="sync-icon">⏳</span><span>Синхронизация...</span>';

            const startTime = Date.now();
            const totalChanges = pendingChanges.length;

            try {
                // Step 1: Sync pending changes (if any)
                if (pendingChanges.length > 0) {
                    console.log('📤 Отправка несинхронизированных изменений в Supabase...');
                    await syncPendingChangesToSupabase();
                }

                // Step 2: Fetch fresh data from Supabase
                console.log('📥 Загрузка данных из Supabase...');

                // Fetch athletes
                const { data: athletes, error: athletesError } = await supabaseClient
                    .from('athletes')
                    .select('*')
                    .order('name', { ascending: true });

                if (athletesError) throw athletesError;

                // Fetch exercises
                const { data: exercises, error: exercisesError } = await supabaseClient
                    .from('exercises')
                    .select('*')
                    .order('name', { ascending: true });

                if (exercisesError) throw exercisesError;

                // Fetch goals with athlete and exercise names
                const { data: goals, error: goalsError } = await supabaseClient
                    .from('goals')
                    .select(`
                        *,
                        athletes!inner(name),
                        exercises!inner(name)
                    `);

                if (goalsError) throw goalsError;

                // Fetch performances (for athlete monthly records)
                const { data: performances, error: performancesError } = await supabaseClient
                    .from('performances')
                    .select(`
                        *,
                        exercises!inner(name, type)
                    `);

                if (performancesError) throw performancesError;

                // Step 3: Transform data to PWA format
                console.log('🔄 Трансформация данных...');

                // Transform athletes with performances
                athletesData = athletes.map(athlete => transformSupabaseAthlete(athlete, performances));
                
                // 🔍 DEBUG: Log transformed Baigozin
                const transformedBaigozin = athletesData.find(a => a.name && a.name.includes('Байгозин'));
                if (transformedBaigozin) {
                    console.log('🔍 DEBUG Байгозин после трансформации:', {
                        name: transformedBaigozin.name,
                        group: transformedBaigozin.group,
                        schedule: transformedBaigozin.schedule,
                        rank_start: transformedBaigozin.rank_start
                    });
                }

                // Transform exercises (simple mapping)
                exercisesData = exercises.map(ex => ({
                    id: ex.id,
                    name: ex.name,
                    type: ex.type,
                    category: ex.category,
                    unit: ex.unit || 'count',
                    score: ex.score || 0
                }));
                console.log('🔢 Загружено упражнений с баллами:', exercisesData.filter(e => e.score > 0).length);

                // Transform goals with JOIN data
                goalsData = goals.map(goal => transformSupabaseGoal(
                    goal,
                    goal.athletes?.name || 'Unknown',
                    goal.exercises?.name || 'Unknown'
                ));

                // Step 4: Save to localStorage
                saveToLocalStorage();
                calculateAllTimeRecords();
                
                // 🔍 DEBUG: Log data before render
                console.log('🔍 DEBUG: athletesData перед renderAthletes():', athletesData.length);
                console.log('🔍 DEBUG: Первый спортсмен:', athletesData[0]);
                
                renderAthletes();
                
                // 🔍 DEBUG: Log after render
                console.log('🔍 DEBUG: renderAthletes() вызван успешно');

                // Success state
                button.classList.remove('syncing');
                button.classList.add('success');
                button.innerHTML = '<span>✅</span><span>Синхронизировано</span>';
                button.disabled = false;

                setTimeout(() => {
                    button.classList.remove('success');
                    updatePendingIndicator();
                }, 2000);

                console.log(`✅ Синхронизация с Supabase завершена за ${Date.now() - startTime}ms`);
                console.log(`📊 Загружено: Athletes=${athletesData.length}, Exercises=${exercisesData.length}, Goals=${goalsData.length}`);

            } catch (error) {
                console.error('❌ Ошибка синхронизации с Supabase:', error);

                button.classList.remove('syncing');
                button.classList.add('error');
                button.disabled = false;

                let errorMsg = 'Ошибка Supabase';
                if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    errorMsg = 'Нет интернета';
                } else if (error.code) {
                    errorMsg = `Ошибка ${error.code}`;
                }

                button.innerHTML = `<span>❌</span><span>${errorMsg}</span>`;

                setTimeout(() => {
                    button.classList.remove('error');
                    updatePendingIndicator();
                }, 3000);
            }
        }

        // Sync pending changes to Supabase
        async function syncPendingChangesToSupabase() {
            const errors = [];
            const successfulChanges = [];

            // Coalesce changes (merge multiple edits to same entity)
            const coalescedChanges = coalescePendingChanges();
            console.log(`📊 Оптимизация очереди: ${pendingChanges.length} → ${coalescedChanges.length} изменений`);

            for (const change of coalescedChanges) {
                try {
                    if (change.type === 'athlete') {
                        // Update athlete record

                        if ('group' in change.data && change.data.group !== null && change.data.group !== undefined) {
                            updateData.group_name = change.data.group;

                        // Add rank_end if present in change data

                        const { error: athleteError } = await supabaseClient
                            .from('athletes')
                            .update(updateData)
                            .eq('id', change.athleteId);

                        if (athleteError) throw athleteError;

                        // Only process performances if they exist in change.data
                        if (change.data.performance && Array.isArray(change.data.performance)) {
                            // Get exercise IDs for mapping
                            const exerciseMap = {
                                'pullUps': exercisesData.find(e => e.name === 'Подтягивания')?.id,
                                'pushUps': exercisesData.find(e => e.name === 'Отжимания от пола')?.id,

                            };

                            // Delete old performances for this athlete (clean slate approach)
                            const { error: deleteError } = await supabaseClient
                                .from('performances')
                                .delete()
                                .eq('athlete_id', change.athleteId);

                            if (deleteError) throw deleteError;

                            // Insert new performances
                            const performancesToInsert = [];

                            change.data.performance.forEach((monthData, index) => {
                            const month = MONTHS[index];

                            // Calculate date for this month (current season)
                            const monthIndex = MONTHS.indexOf(month);
                            let year = currentSeason.startYear;
                            let monthNumber = 9 + monthIndex; // Sept = 9

                            if (monthNumber > 12) {
                                monthNumber -= 12;
                                year = currentSeason.endYear;
                            }

                            const recorded_at = `${year}-${String(monthNumber).padStart(2, '0')}-15`;

                            // Add pull-ups performance
                            if (monthData.pullUps && monthData.pullUps > 0 && exerciseMap.pullUps) {
                                performancesToInsert.push({
                                    athlete_id: change.athleteId,
                                    exercise_id: exerciseMap.pullUps,
                                    value: monthData.pullUps,
                                    recorded_at: recorded_at,
                                    notes: month
                                });
                            }

                            // Add push-ups performance
                            if (monthData.pushUps && monthData.pushUps > 0 && exerciseMap.pushUps) {
                                performancesToInsert.push({
                                    athlete_id: change.athleteId,
                                    exercise_id: exerciseMap.pushUps,
                                    value: monthData.pushUps,
                                    recorded_at: recorded_at,
                                    notes: month
                                });
                            }

                            // Add dips performance
                            if (monthData.dips && monthData.dips > 0 && exerciseMap.dips) {
                                performancesToInsert.push({
                                    athlete_id: change.athleteId,
                                    exercise_id: exerciseMap.dips,
                                    value: monthData.dips,
                                    recorded_at: recorded_at,
                                    notes: month
                                });
                            }
                        });

                            // Insert all performances in one batch
                            if (performancesToInsert.length > 0) {
                                const { error: insertError } = await supabaseClient
                                    .from('performances')
                                    .insert(performancesToInsert);

                                if (insertError) throw insertError;
                                console.log(`✅ Сохранено ${performancesToInsert.length} показателей`);
                            }
                        }

                        successfulChanges.push(change);

                    } else if (change.type === 'goal') {
                        if (change.action === 'create') {
                            console.log('📤 Создание цели в Supabase:', change.goalData.exerciseName);

                            const { error } = await supabaseClient
                                .from('goals')
                                .insert({
                                    id: change.goalData.id,
                                    athlete_id: change.goalData.studentId,
                                    exercise_id: change.goalData.exerciseId,
                                    target_value: change.goalData.targetValue || 10,
                                    start_date: change.goalData.startDate,
                                    end_date: change.goalData.endDate,
                                    description: change.goalData.description,
                                    completed: false
                                });

                            if (error) throw error;
                            successfulChanges.push(change);

                        } else if (change.action === 'delete') {
                            console.log('📤 Удаление цели в Supabase:', change.goalId);

                            const { error } = await supabaseClient
                                .from('goals')
                                .delete()
                                .eq('id', change.goalId);

                            if (error) throw error;
                            successfulChanges.push(change);

                        } else if (change.action === 'complete' || change.action === 'uncomplete') {
                            console.log('📤 Обновление статуса цели в Supabase:', change.goalId);

                            const { error } = await supabaseClient
                                .from('goals')
                                .update({
                                    completed: change.action === 'complete',
                                    updated_at: new Date().toISOString()
                                })
                                .eq('id', change.goalId);

                            if (error) throw error;
                            successfulChanges.push(change);
                        }

                    } else if (change.type === 'goal_edit') {
                        console.log('📤 Редактирование цели в Supabase:', change.goalId);

                        const { error } = await supabaseClient
                            .from('goals')
                            .update({
                                start_date: change.changes.startDate,
                                end_date: change.changes.endDate,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', change.goalId);

                        if (error) throw error;
                        successfulChanges.push(change);

                    } else if (change.type === 'schedule') {
                        console.log('📅 Синхронизация расписания в Supabase:', change.athleteId);

                        const { error } = await supabaseClient
                            .from('athletes')
                            .update({
                                schedule: change.schedule,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', change.athleteId);

                        if (error) throw error;
                        console.log('✅ Расписание синхронизировано:', change.schedule);
                        successfulChanges.push(change);
                    }

                } catch (error) {
                    console.error('❌ Ошибка синхронизации изменения:', error);
                    console.error('📋 Детали изменения:', {
                        type: change.type,
                        action: change.action,
                        athleteId: change.athleteId,
                        athleteName: change.athleteName,
                        data: change.data,
                        fullChange: change
                    });
                    // Log specific error details for rank data
                    if (change.type === 'athlete' && ('rank_start' in change.data || 'rank_end' in change.data)) {
                        console.error('🏆 Ошибка синхронизации разрядов:', {
                            athleteId: change.athleteId,
                            rank_start: change.data.rank_start,
                            rank_end: change.data.rank_end,
                            error: error.message
                        });
                    }
                    // Log specific error details for schedule data
                    if (change.type === 'schedule') {
                        console.error('📅 Ошибка синхронизации расписания:', {
                            athleteId: change.athleteId,
                            schedule: change.schedule,
                            error: error.message
                        });
                    }
                    errors.push(change);
                }
            }

            // Remove successful changes from queue
            if (successfulChanges.length > 0) {
                pendingChanges = pendingChanges.filter(c => !successfulChanges.includes(c));
                saveToLocalStorage();
                console.log(`✅ Синхронизировано ${successfulChanges.length} изменений в Supabase`);
            }

            if (errors.length > 0) {
                console.warn(`⚠️ ${errors.length} изменений не удалось синхронизировать`);
                throw new Error(`Failed to sync ${errors.length} changes`);
            }
        }

        // Синхронизация
        async function syncWithGoogleSheets() {
            const button = document.getElementById('syncBtn');

            // Prevent concurrent syncs
            if (button.classList.contains('syncing')) {
                console.log('⏳ Синхронизация уже идёт, пропускаем');
                return;
            }

            // Start syncing state
            button.classList.add('syncing');
            button.classList.remove('pending', 'success', 'error');
            button.disabled = true;
            button.innerHTML = '<span class="sync-icon">⏳</span><span>Синхронизация...</span>';

            const startTime = Date.now();
            const totalChanges = pendingChanges.length;
            let processedChanges = 0;

            // Timeout handling (30 seconds)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => {
                controller.abort();
            }, 30000);

            try {
                // Сначала отправляем несохраненные изменения
                if (pendingChanges.length > 0) {
                    console.log('📤 Отправка несохраненных изменений...');

                    // Progress counter for >10 changes
                    if (totalChanges > 10) {
                        button.innerHTML = `<span class="sync-icon">⏳</span><span>Синхронизация... (0/${totalChanges})</span>`;
                    }

                    await syncPendingChanges();
                    processedChanges = totalChanges;

                    if (totalChanges > 10) {
                        button.innerHTML = `<span class="sync-icon">⏳</span><span>Синхронизация... (${processedChanges}/${totalChanges})</span>`;
                    }
                }

                // Затем загружаем свежие данные
                console.log('📥 Загрузка учеников...');
                const studentsResponse = await fetch(`${WEBAPP_URL}?action=getAllStudents`, { signal: controller.signal });
                const studentsResult = await studentsResponse.json();

                console.log('📥 Загрузка упражнений...');
                const exercisesResponse = await fetch(`${WEBAPP_URL}?action=getExercises`, { signal: controller.signal });
                const exercisesResult = await exercisesResponse.json();

                console.log('📥 Загрузка целей...');
                const goalsResponse = await fetch(`${WEBAPP_URL}?action=getGoals`, { signal: controller.signal });
                const goalsResult = await goalsResponse.json();

                clearTimeout(timeoutId);

                if (studentsResult.success && studentsResult.data.students) {
                    athletesData = studentsResult.data.students.map(s => ({
                        id: s.id,
                        lastName: s.lastName,
                        firstName: s.firstName,
                        group: s.group,
                        schedule: s.schedule || '',
                        active: s.isActive ? 'Да' : 'Нет',
                        performance: s.monthlyRecords,
                        records: {
                            pullUps: {},
                            pushUps: {},
                            dips: {}
                        },
                        created: s.createdAt,
                        updated: s.updatedAt
                    }));

                    athletesData.forEach(a => {
                        a.performance.forEach(p => {
                            if (p.pullUps) a.records.pullUps[p.month] = p.pullUps;
                            if (p.pushUps) a.records.pushUps[p.month] = p.pushUps;
                            if (p.dips) a.records.dips[p.month] = p.dips;
                        });
                    });

                    console.log('✅ Загружено учеников:', athletesData.length);

                    // Пересчитываем all-time рекорды
                    calculateAllTimeRecords();
                }

                if (exercisesResult.success && exercisesResult.data.exercises) {
                    exercisesData = exercisesResult.data.exercises;
                    console.log('✅ Загружено упражнений:', exercisesData.length);
                }

                if (goalsResult.success && goalsResult.data.goals) {
                    goalsData = goalsResult.data.goals.map(g => ({
                        id: g.id || generateUUID(), // Генерируем UUID если нет ID
                        studentId: g.studentId,
                        studentName: g.studentName,
                        exerciseId: g.exerciseId,
                        exerciseName: g.exerciseName,
                        setDate: g.dateSet,
                        completionDate: g.dateCompleted,
                        notes: g.notes
                    }));
                    console.log('✅ Загружено целей:', goalsData.length);
                }

                saveToLocalStorage();
                renderAthletes();

                // Success state (2 seconds)
                button.classList.remove('syncing');
                button.classList.add('success');
                button.innerHTML = '<span>✅</span><span>Синхронизировано</span>';
                button.disabled = false;

                setTimeout(() => {
                    button.classList.remove('success');
                    updatePendingIndicator(); // Return to idle/pending
                }, 2000);

                console.log(`✅ Синхронизация завершена за ${Date.now() - startTime}ms`);
                console.log(`Ученики: ${athletesData.length}, Упражнения: ${exercisesData.length}, Цели: ${goalsData.length}`);

            } catch (error) {
                console.error('❌ Ошибка синхронизации:', error);

                button.classList.remove('syncing');
                button.classList.add('error');
                button.disabled = false;

                // User-friendly error messages in Russian
                let errorMsg = 'Ошибка синхронизации';
                if (error.name === 'AbortError') {
                    errorMsg = 'Проверьте подключение';
                } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    errorMsg = 'Нет интернета';
                } else if (error.message.includes('500')) {
                    errorMsg = 'Проблема на сервере';
                }

                button.innerHTML = `<span>❌</span><span>${errorMsg}</span>`;

                setTimeout(() => {
                    button.classList.remove('error');
                    updatePendingIndicator(); // Return to pending state
                }, 3000);
            }
        }

        // Объединение множественных изменений одной цели в одно (последнее)
        function coalescePendingChanges() {
            const goalEdits = new Map(); // goalId -> последнее изменение
            const otherChanges = [];

            pendingChanges.forEach(change => {
                if (change.type === 'goal_edit') {
                    // Сохраняем только последнее изменение для каждой цели
                    const existingEdit = goalEdits.get(change.goalId);
                    if (!existingEdit || new Date(change.timestamp) > new Date(existingEdit.timestamp)) {
                        goalEdits.set(change.goalId, change);
                    }
                } else {
                    // Остальные типы изменений не объединяем
                    otherChanges.push(change);
                }
            });

            // Объединяем результаты: сначала goal_edit (объединенные), потом остальные
            return [...Array.from(goalEdits.values()), ...otherChanges];
        }

        // Синхронизация несохраненных изменений
        async function syncPendingChanges() {
            const errors = [];
            const successfulChanges = [];

            // Оптимизация: объединяем множественные изменения одной цели
            const coalescedChanges = coalescePendingChanges();
            console.log(`📊 Оптимизация очереди: ${pendingChanges.length} → ${coalescedChanges.length} изменений`);

            for (const change of coalescedChanges) {
                try {
                    if (change.type === 'athlete') {
                        console.log('📤 Синхронизация показателей:', change.athleteName);
                        const response = await fetch(WEBAPP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'updateStudent',
                                params: { studentData: change.data }
                            })
                        });

                        if (response.ok) {
                            const result = await response.json();
                            if (result.success) {
                                successfulChanges.push(change);
                            }
                        }
                    } else if (change.type === 'goal') {
                        if (change.action === 'delete') {
                            console.log('📤 Удаление цели:', change.goalId);
                            const response = await fetch(WEBAPP_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({
                                    action: 'deleteGoal',
                                    params: {
                                        goalId: change.goalId
                                    }
                                })
                            });

                            if (response.ok) {
                                const result = await response.json();
                                if (result.success) {
                                    successfulChanges.push(change);
                                }
                            }
                        } else {
                            console.log('📤 Синхронизация цели:', change.goalId);
                            const response = await fetch(WEBAPP_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({
                                    action: 'updateGoal',
                                    params: {
                                        goalData: {
                                            id: change.goalId,
                                            completionDate: change.completionDate
                                        }
                                    }
                                })
                            });

                            if (response.ok) {
                                const result = await response.json();
                                if (result.success) {
                                    successfulChanges.push(change);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('❌ Ошибка синхронизации:', error);
                    errors.push(change);
                }
            }

            // Убираем успешно синхронизированные
            if (successfulChanges.length > 0) {
                pendingChanges = pendingChanges.filter(c => !successfulChanges.includes(c));
                saveToLocalStorage();
                console.log(`✅ Синхронизировано ${successfulChanges.length} изменений`);
            }

            if (errors.length > 0) {
                console.warn(`⚠️ ${errors.length} изменений не удалось синхронизировать`);
            }
        }

        // T028: Get schedule entries from form
        function getScheduleEntries() {
            const container = document.getElementById('scheduleEntriesContainer');
            const entries = [];

            container.querySelectorAll('.schedule-entry').forEach(entry => {
                const day = entry.querySelector('.schedule-day').value;
                const time = entry.querySelector('.schedule-time').value;
                if (day && time) {
                    entries.push({ day, time });
                }
            });

            return entries;
        }

        // Helper: Parse schedule string into entries
        function parseAndRenderSchedule(scheduleString) {
            console.log('📅 Parsing schedule string:', scheduleString);
            if (!scheduleString || scheduleString === 'Самозапись') {
                renderScheduleEntries([]);
                return;
            }

            // Parse format: "Пн 18:00, Ср 19:00, Пт 18:00"
            const entries = scheduleString.split(',').map(entry => {
                const parts = entry.trim().split(' ');
                if (parts.length === 2) {
                    return { day: parts[0], time: parts[1] };
                }
                return null;
            }).filter(e => e !== null);

            renderScheduleEntries(entries);
        }

        // T029: Save schedule
        async function saveSchedule(event) {
            event.preventDefault();
            console.log('📅 Saving schedule');

            const athleteId = document.getElementById('scheduleAthleteId').value;
            const athlete = athletesData.find(a => a.id == athleteId);
            if (!athlete) return;

            // Determine schedule value
            let scheduleValue = '';
            const activeType = document.querySelector('.schedule-type-btn.active').dataset.type;

            if (activeType === 'self-reg') {
                scheduleValue = 'Самозапись';
            } else {
                // Fixed schedule: format as "Пн 18:00, Ср 19:00"
                const entries = getScheduleEntries();
                if (entries.length === 0) {
                    alert('⚠️ Добавьте хотя бы одно время занятия или выберите "Самозапись"');
                    return;
                }

                // T082: Validate schedule format
                const validDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                const timeRegex = /^([0-1][0-9]|2[0-3]):([0-5][0-9])$/;

                for (const entry of entries) {
                    if (!validDays.includes(entry.day)) {
                        alert(`⚠️ Неверный день недели: ${entry.day}`);
                        return;
                    }
                    if (!timeRegex.test(entry.time)) {
                        alert(`⚠️ Неверный формат времени: ${entry.time}. Используйте формат ЧЧ:ММ (например, 18:00)`);
                        return;
                    }
                }

                scheduleValue = entries.map(e => `${e.day} ${e.time}`).join(', ');
            }

            console.log('📅 Schedule value:', scheduleValue);

            // Update local data
            athlete.schedule = scheduleValue;

            // Add to pending changes for Supabase sync
            pendingChanges.push({
                type: 'schedule',
                athleteId: athleteId,
                schedule: scheduleValue
            });

            saveToLocalStorage();

            // Update UI
            renderAthletes();
            closeScheduleModal();

            // Refresh athlete details if modal is open
            if (document.getElementById('athleteModal').classList.contains('show')) {
                showAthleteDetails(athleteId);
            }

            updatePendingIndicator();

            // Try automatic sync if online
            if (navigator.onLine) {
                console.log('📅 Attempting automatic sync...');
                try {
                    await syncWithSupabase();
                } catch (err) {
                    console.error('❌ Auto-sync failed:', err);
                }
            }

            alert('✅ Расписание сохранено локально!\n\n' +
                  (navigator.onLine ? 'Нажмите "Синхронизировать" для отправки на сервер.' : 'Будет синхронизировано при подключении к интернету.'));
        }

        // ============================================================================
        // Feature 007: Аналитика по группам
        // ============================================================================

        // T011: Рассчитать статистику по группе
        function calculateGroupStatistics(groupName) {
            console.log(`📊 Расчёт статистики для группы: ${groupName}`);

            // Получить спортсменов в группе
            const groupAthletes = athletesData.filter(athlete => athlete.group === groupName);
            const athleteCount = groupAthletes.length;
            
            console.log(`📊 Найдено ${athleteCount} спортсменов в группе ${groupName}`);
            
            if (athleteCount === 0) {
                return {
                    groupName: groupName,
                    athleteCount: 0,
                    averagePerformance: {},
                    topPerformers: []
                };
            }
            
            // Fix: Use athlete.performance array instead of athlete.records object
            // athlete.performance = [{month: '2024-09', pullUps: 10, pushUps: 20, dips: 15}, ...]
            const athleteIds = groupAthletes.map(a => a.id);
            const groupPerformances = athletesData
                .filter(athlete => athleteIds.includes(athlete.id))
                .flatMap(athlete => {
                    if (!athlete.performance || !Array.isArray(athlete.performance)) {
                        return [];
                    }
                    // Transform performance array to flat list of exercise results
                    return athlete.performance.flatMap(monthData => {
                        const results = [];
                        const exercises = ['pullUps', 'pushUps', 'dips'];
                        exercises.forEach(exercise => {
                            if (monthData[exercise] && monthData[exercise] > 0) {
                                // Find exercise name in exercisesData
                                const exerciseData = exercisesData.find(e => e.id === exercise);
                                const exerciseName = exerciseData ? exerciseData.name : exercise;

                                results.push({
                                    athleteId: athlete.id,
                                    athleteName: athlete.name,
                                    exerciseName: exerciseName,
                                    value: parseFloat(monthData[exercise]) || 0,
                                    date: monthData.month
                                });
                            }
                        });
                        return results;
                    });
                })
                .filter(perf => perf.value > 0);
            
            console.log(`📊 Найдено ${groupPerformances.length} результатов для группы ${groupName}`);
            
            // Рассчитать средние результаты по упражнениям
            const averagePerformance = {};
            const exerciseGroups = {};
            
            groupPerformances.forEach(perf => {
                if (!exerciseGroups[perf.exerciseName]) {
                    exerciseGroups[perf.exerciseName] = [];
                }
                exerciseGroups[perf.exerciseName].push(perf.value);
            });
            
            Object.keys(exerciseGroups).forEach(exerciseName => {
                const values = exerciseGroups[exerciseName];
                const sum = values.reduce((a, b) => a + b, 0);
                const avg = sum / values.length;
                averagePerformance[exerciseName] = Math.round(avg * 100) / 100; // Округлить до 2 знаков
            });
            
            // Найти топ-исполнителей (лучший результат по каждому упражнению)
            const topPerformers = [];
            Object.keys(exerciseGroups).forEach(exerciseName => {
                const exercisePerformances = groupPerformances
                    .filter(perf => perf.exerciseName === exerciseName)
                    .sort((a, b) => b.value - a.value); // Сортировать по убыванию
                
                if (exercisePerformances.length > 0) {
                    const best = exercisePerformances[0];
                    topPerformers.push({
                        athleteId: best.athleteId,
                        athleteName: best.athleteName,
                        exerciseName: best.exerciseName,
                        value: best.value
                    });
                }
            });
            
            console.log(`📊 Статистика для ${groupName}:`, {
                athleteCount,
                exercisesCount: Object.keys(averagePerformance).length,
                topPerformersCount: topPerformers.length
            });
            
            return {
                groupName: groupName,
                athleteCount: athleteCount,
                averagePerformance: averagePerformance,
                topPerformers: topPerformers
            };
        }

        // T022: Отрисовать график SVG
        function renderExerciseChart(groupStats, exerciseName) {
            console.log(`📊 Рендеринг графика для ${exerciseName}`);
            
            const svg = document.getElementById('exercise-chart');
            if (!svg) {
                console.error('❌ SVG элемент exercise-chart не найден');
                return;
            }
            
            // Отфильтровать группы с данными
            const statsWithData = groupStats.filter(stat => stat.totalResults > 0);
            
            if (statsWithData.length === 0) {
                svg.innerHTML = `
                    <text x="50%" y="50%" text-anchor="middle" fill="#6b6f82" font-size="14">
                        Нет данных для графика
                    </text>
                `;
                return;
            }
            
            // Параметры графика
            const width = svg.clientWidth || 320;
            const height = 300;
            const margin = { top: 20, right: 20, bottom: 60, left: 50 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            
            // Найти максимальное значение для масштабирования
            const maxValue = Math.max(...statsWithData.map(stat => stat.avgResult));
            const yScale = chartHeight / maxValue;
            
            // Ширина столбца
            const barWidth = chartWidth / statsWithData.length - 10;
            
            // Очистить SVG
            svg.innerHTML = '';
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            
            // Отрисовать столбцы
            statsWithData.forEach((stat, index) => {
                const x = margin.left + (index * (chartWidth / statsWithData.length)) + 5;
                const barHeight = stat.avgResult * yScale;
                const y = margin.top + chartHeight - barHeight;
                
                // Столбец
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('fill', '#4c9eff');
                rect.setAttribute('rx', '4');
                svg.appendChild(rect);
                
                // Значение над столбцом
                const valueText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                valueText.setAttribute('x', x + barWidth / 2);
                valueText.setAttribute('y', y - 5);
                valueText.setAttribute('text-anchor', 'middle');
                valueText.setAttribute('fill', '#ffffff');
                valueText.setAttribute('font-size', '12');
                valueText.setAttribute('font-weight', '600');
                valueText.textContent = stat.avgResult;
                svg.appendChild(valueText);
                
                // Название группы под столбцом
                const labelText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelText.setAttribute('x', x + barWidth / 2);
                labelText.setAttribute('y', margin.top + chartHeight + 20);
                labelText.setAttribute('text-anchor', 'middle');
                labelText.setAttribute('fill', '#8b8f9f');
                labelText.setAttribute('font-size', '13');
                labelText.textContent = stat.groupName;
                svg.appendChild(labelText);
            });
            
            // Ось Y (базовая линия)
            const axisLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            axisLine.setAttribute('x1', margin.left);
            axisLine.setAttribute('y1', margin.top);
            axisLine.setAttribute('x2', margin.left);
            axisLine.setAttribute('y2', margin.top + chartHeight);
            axisLine.setAttribute('stroke', '#2a2d3a');
            axisLine.setAttribute('stroke-width', '2');
            svg.appendChild(axisLine);
            
            // Ось X (базовая линия)
            const xAxisLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            xAxisLine.setAttribute('x1', margin.left);
            xAxisLine.setAttribute('y1', margin.top + chartHeight);
            xAxisLine.setAttribute('x2', margin.left + chartWidth);
            xAxisLine.setAttribute('y2', margin.top + chartHeight);
            xAxisLine.setAttribute('stroke', '#2a2d3a');
            xAxisLine.setAttribute('stroke-width', '2');
            svg.appendChild(xAxisLine);
            
            console.log(`✅ График отрисован для ${statsWithData.length} групп`);
        }

        // T020: Рассчитать статистику по упражнению для каждой группы
        function calculateExerciseStatsByGroup(exerciseName) {
            console.log(`📊 Расчёт статистики по упражнению: ${exerciseName}`);

            // ✅ Map exercise names to performance field keys
            const exerciseKeyMap = {
                'Подтягивания': 'pullUps',
                'Отжимания от пола': 'pushUps',
                'Отжимания от брусьев': 'dips'
            };
            const exerciseKey = exerciseKeyMap[exerciseName] || null;

            if (!exerciseKey) {
                console.warn(`⚠️ Неизвестное упражнение: ${exerciseName}`);
            }

            const groupStats = AVAILABLE_GROUPS.map(groupName => {
                // Получить спортсменов группы (используем .group вместо .group_name)
                const groupAthletes = athletesData.filter(athlete => athlete.group === groupName);

                // Собрать результаты по данному упражнению
                const exerciseResults = [];
                groupAthletes.forEach(athlete => {
                    // Use athlete.performance array with exerciseKey mapping
                    if (athlete.performance && Array.isArray(athlete.performance) && exerciseKey) {
                        athlete.performance.forEach(monthData => {
                            const value = monthData[exerciseKey] ? parseFloat(monthData[exerciseKey]) : 0;
                            if (value > 0) {
                                exerciseResults.push({
                                    athleteId: athlete.id,
                                    athleteName: athlete.name,
                                    value: value,
                                    date: monthData.month
                                });
                            }
                        });
                    }
                });
                
                // Рассчитать статистику
                let avgResult = 0;
                let bestResult = 0;
                let athleteCount = new Set(exerciseResults.map(r => r.athleteId)).size;
                
                if (exerciseResults.length > 0) {
                    const sum = exerciseResults.reduce((acc, r) => acc + r.value, 0);
                    avgResult = Math.round((sum / exerciseResults.length) * 100) / 100;
                    bestResult = Math.max(...exerciseResults.map(r => r.value));
                }
                
                return {
                    groupName: groupName,
                    avgResult: avgResult,
                    bestResult: bestResult,
                    athleteCount: athleteCount,
                    totalResults: exerciseResults.length
                };
            });
            
            console.log(`✅ Рассчитана статистика по ${exerciseName} для ${groupStats.length} групп`);
            return groupStats;
        }

            // T030: Проверка на пустые данные
            if (!exercisesData || exercisesData.length === 0) {

                    uniqueExercisesMap.set(ex.name, ex);
                }
            });
            
            // Сортировать по баллам (score) по возрастанию
            const sortedExercises = Array.from(uniqueExercisesMap.values()).sort((a, b) => {
                const scoreA = a.score || 0;
                const scoreB = b.score || 0;
                return scoreA - scoreB;
            });
            
            console.log(`📊 Найдено ${sortedExercises.length} уникальных упражнений`);
            console.log(`🔢 Упражнения отсортированы по баллам`);
            
            // Очистить селектор и добавить опции
            selector.innerHTML = '<option value="">Выберите упражнение...</option>';
            sortedExercises.forEach(exercise => {
                const typeLabel = formatExerciseType(exercise.type);
                const score = exercise.score || 0;
                const displayText = `${exercise.name} ${typeLabel} ${score}`;
                
                const option = document.createElement('option');
                option.value = exercise.name;
                option.textContent = displayText;
                selector.appendChild(option);
            });

                let text = ex.label;
                if (journalExerciseFilter.field === ex.field) {
                    if (journalExerciseFilter.mode === 'has') {
                        cls += ' journal-filter-chip--has';
                        text = '✓ ' + ex.label;
                    } else if (journalExerciseFilter.mode === 'missing') {
                        cls += ' journal-filter-chip--missing';
                        text = '✗ ' + ex.label;
                    }
                }
                return `<button class="${cls}" onclick="toggleJournalExerciseFilter('${ex.field}')">${text}</button>`;
            }).join('');
        }

        function toggleJournalExerciseFilter(field) {
            if (journalExerciseFilter.field === field) {
                // Cycle: has → missing → off
                if (journalExerciseFilter.mode === 'has') {
                    journalExerciseFilter.mode = 'missing';
                } else {
                    journalExerciseFilter = { field: null, mode: null };
                }
            } else {
                journalExerciseFilter = { field: field, mode: 'has' };
            }
            renderJournalExerciseFilter();
            renderJournalTable();
        }

        // === Filtered Athletes ===

        function getJournalFilteredAthletes() {
            const monthIndex = getJournalMonthIndex();

            let filtered = athletesData.filter(a => {
                // Без группы — не показываем
                if (!a.group) return false;
                // Только активные
                if (a.status && a.status !== 'active') return false;
                // Фильтр по группам
                if (journalSelectedGroups.length > 0 && !journalSelectedGroups.includes(a.group)) return false;
                return true;
            });

            // Фильтр по упражнению
            if (journalExerciseFilter.field && journalExerciseFilter.mode) {
                const f = journalExerciseFilter.field;
                const m = journalExerciseFilter.mode;
                filtered = filtered.filter(a => {
                    const perf = a.performance && a.performance[monthIndex];
                    const val = perf ? perf[f] : undefined;
                    if (m === 'has') return val !== undefined && val !== null && val > 0;
                    if (m === 'missing') return val === undefined || val === null || val === 0;
                    return true;
                });
            }

            // Сортировка по фамилии
            filtered.sort((a, b) => (a.lastName || '').localeCompare(b.lastName || '', 'ru'));
            return filtered;
        }

        // === Render Table ===

        function renderJournalTable() {
            const thead = document.getElementById('journal-thead');
            const tbody = document.getElementById('journal-tbody');
            if (!thead || !tbody) return;

            const monthIndex = getJournalMonthIndex();

            // Заголовок таблицы
            thead.innerHTML = `<tr><th>Имя</th>${JOURNAL_EXERCISES.map(ex => `<th>${ex.label}</th>`).join('')}</tr>`;

            // Пустое состояние
            if (journalSelectedGroups.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="journal-empty-msg">Выберите группу</td></tr>`;
                updateJournalCounter(0, 0);
                return;
            }

            const filtered = getJournalFilteredAthletes();

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="journal-empty-msg">Нет учеников в группе</td></tr>`;
                updateJournalCounter(0, 0);
                return;
            }

            // Мультигрупповой режим: группировка с подзаголовками
            if (journalSelectedGroups.length > 1) {
                let html = '';
                journalSelectedGroups.forEach(groupName => {
                    const groupAthletes = filtered.filter(a => a.group === groupName);
                    if (groupAthletes.length === 0) return;
                    html += `<tr class="journal-group-header"><td colspan="4">${groupName} (${groupAthletes.length})</td></tr>`;
                    groupAthletes.forEach(athlete => {
                        html += renderJournalRow(athlete, monthIndex);
                    });
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = filtered.map(athlete => renderJournalRow(athlete, monthIndex)).join('');
            }

            const totalForCounter = athletesData.filter(a => a.group && journalSelectedGroups.includes(a.group) && (!a.status || a.status === 'active')).length;
            const withValues = athletesData.filter(a => {
                if (!a.group || !journalSelectedGroups.includes(a.group)) return false;
                if (a.status && a.status !== 'active') return false;
                const perf = a.performance && a.performance[monthIndex];
                if (!perf) return false;
                return (perf.pullUps > 0) || (perf.pushUps > 0) || (perf.dips > 0);
            }).length;

            updateJournalCounter(withValues, totalForCounter);
            console.log('📓 Отрисовка: ' + filtered.length + ' учеников');
        }

        function renderJournalRow(athlete, monthIndex) {
            const perf = (athlete.performance && athlete.performance[monthIndex]) || {};
            const records = allTimeRecords[athlete.id] || {};
            const nameDisplay = athlete.lastName + ' ' + (athlete.firstName ? athlete.firstName.charAt(0) + '.' : '');

            let cells = '';
            JOURNAL_EXERCISES.forEach(ex => {
                const val = perf[ex.field];
                const rec = records[ex.field] || 0;
                const hasValue = val !== undefined && val !== null;
                const displayVal = hasValue ? String(val) : '—';
                const isEmpty = !hasValue;

                // Показать рекорд если > 0 и отличается от текущего значения
                let recordHtml = '';
                if (rec > 0 && (!hasValue || rec !== val)) {
                    recordHtml = `<div class="journal-cell__record">р:${rec}</div>`;
                }

                cells += `<td><div class="journal-cell${isEmpty ? ' journal-cell--empty' : ''}" onclick="startJournalCellEdit('${athlete.id}', '${ex.field}')"><div class="journal-cell__value">${displayVal}</div>${recordHtml}</div></td>`;
            });

            return `<tr>${'<td>' + nameDisplay + '</td>'}${cells}</tr>`;
        }

        function updateJournalCounter(withValues, total) {
            const counter = document.getElementById('journal-counter');
            if (counter) {
                counter.textContent = `Принято: ${withValues}/${total}`;
            }
        }

        // === Cell Editing ===

        function startJournalCellEdit(athleteId, exerciseField) {
            // Отменить предыдущее редактирование
            if (journalEditingCell) {
                cancelJournalCellEdit();
            }

            const athlete = athletesData.find(a => a.id === athleteId);
            if (!athlete) return;

            const monthIndex = getJournalMonthIndex();
            const perf = (athlete.performance && athlete.performance[monthIndex]) || {};
            const currentVal = perf[exerciseField];
            const hasValue = currentVal !== undefined && currentVal !== null;

            const exName = JOURNAL_EXERCISES.find(e => e.field === exerciseField)?.fullLabel || exerciseField;
            console.log('📓 Редактирование: ' + athlete.lastName + ' ' + athlete.firstName + ' / ' + exName);

            journalEditingCell = { athleteId, exerciseField };

            // Найти ячейку и заменить на input
            const rows = document.querySelectorAll('#journal-tbody tr');
            for (const row of rows) {
                const nameCell = row.querySelector('td:first-child');
                if (!nameCell || row.classList.contains('journal-group-header')) continue;
                // Проверяем по data-athlete-id или по тексту имени
                const cells = row.querySelectorAll('td');
                // Определяем индекс упражнения
                const exIdx = JOURNAL_EXERCISES.findIndex(e => e.field === exerciseField);
                if (exIdx < 0) continue;

                // Проверяем — это нужный атлет? Используем onclick в ячейке
                const cellDiv = cells[exIdx + 1]?.querySelector('.journal-cell');
                if (cellDiv && cellDiv.getAttribute('onclick')?.includes(athleteId)) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.inputMode = 'numeric';
                    input.pattern = '[0-9]*';
                    input.min = '0';
                    if (hasValue && currentVal > 0) input.value = currentVal;
                    input.style.cssText = 'width:100%;max-width:60px;background:#2a2d3a;color:#fff;border:1px solid #4c9eff;border-radius:6px;font-size:17px;text-align:center;padding:4px;min-height:36px;-webkit-appearance:none;outline:none';

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            saveJournalCellValue(athleteId, exerciseField, input.value);
                        } else if (e.key === 'Escape') {
                            cancelJournalCellEdit();
                        }
                    });

                    input.addEventListener('blur', () => {
                        // Небольшая задержка чтобы не конфликтовать с Enter
                        setTimeout(() => {
                            if (journalEditingCell && journalEditingCell.athleteId === athleteId && journalEditingCell.exerciseField === exerciseField) {
                                if (input.value.trim() === '') {
                                    cancelJournalCellEdit();
                                } else {
                                    saveJournalCellValue(athleteId, exerciseField, input.value);
                                }
                            }
                        }, 100);
                    });

                    cellDiv.innerHTML = '';
                    cellDiv.appendChild(input);
                    cellDiv.setAttribute('onclick', ''); // Убрать onclick пока редактируем
                    input.focus();
                    return;
                }
            }
        }

        function saveJournalCellValue(athleteId, exerciseField, rawValue) {
            const athlete = athletesData.find(a => a.id === athleteId);
            if (!athlete) return;

            const parsed = parseInt(rawValue, 10);
            if (isNaN(parsed) || parsed < 0) {
                cancelJournalCellEdit();
                return;
            }

            const monthIndex = getJournalMonthIndex();
            const exName = JOURNAL_EXERCISES.find(e => e.field === exerciseField)?.fullLabel || exerciseField;

            // Обновить in-memory performance
            if (!athlete.performance) {
                athlete.performance = MONTHS.map(month => ({ month, pullUps: 0, pushUps: 0, dips: 0 }));
            }
            athlete.performance[monthIndex][exerciseField] = parsed;

            // Обновить records
            if (!athlete.records) athlete.records = { pullUps: {}, pushUps: {}, dips: {} };
            if (!athlete.records[exerciseField]) athlete.records[exerciseField] = {};
            if (parsed > 0) {
                athlete.records[exerciseField][MONTHS[monthIndex]] = parsed;
            } else {
                delete athlete.records[exerciseField][MONTHS[monthIndex]];
            }

            // Пересчитать all-time рекорды
            calculateAllTimeRecords();

            // pendingChanges (тот же формат что recordsForm)
            const studentData = {
                id: athlete.id,
                group: athlete.group,
                schedule: athlete.schedule,
                rank_start: athlete.rank_start,
                rank_end: athlete.rank_end,
                performance: athlete.performance.map(p => ({
                    pullUps: p.pullUps,
                    pushUps: p.pushUps,
                    dips: p.dips
                }))
            };

            pendingChanges.push({
                type: 'athlete',
                athleteId: athlete.id,
                athleteName: `${athlete.lastName} ${athlete.firstName}`,
                data: studentData
            });

            saveToLocalStorage();
            updatePendingIndicator();

            console.log('✅ Сохранено: ' + athlete.lastName + ' ' + athlete.firstName + ' / ' + exName + ' = ' + parsed);
            console.log('⏳ Добавлено в очередь синхронизации');

            // Сбросить состояние и перерисовать
            journalEditingCell = null;
            renderJournalTable();
        }

        function cancelJournalCellEdit() {
            journalEditingCell = null;
            renderJournalTable();
        }

        // ============================================================================
        // T035: Финальная проверка конституции
        // ============================================================================
        
        // Проверка соответствия Feature 007 конституции проекта
        function verifyFeature007Constitution() {
            console.log('🔍 Проверка Feature 007 на соответствие конституции');
            
            const checks = {
                singleFile: true, // ✅ Всё в index.html
                noDependencies: true, // ✅ Vanilla JS, no npm packages
                offlineFirst: true, // ✅ localStorage first, Supabase sync
                mobileFirst: true, // ✅ Responsive design, touch targets
                darkTheme: true, // ✅ Dark colors (#0f1117, #1a1d29, #4c9eff)
                russianLanguage: true // ✅ Все тексты на русском
            };
            
            console.log('✅ Feature 007 соответствует конституции:', checks);
            return checks;
        }

        // ============================================================================
        // Периодические обновления и инициализация
        // ============================================================================

        setInterval(() => {
            const btn = document.getElementById('syncBtn');
            const wasDisabled = btn.disabled;
            btn.disabled = !navigator.onLine;

            // Если только что подключились к интернету и есть несохраненные изменения
            if (wasDisabled && navigator.onLine && pendingChanges.length > 0) {
                console.log('✅ Интернет подключен, есть несохраненные изменения');
            }

            updatePendingIndicator();
            updateSeasonIndicator();
        }, 5000);
    </script>
