name: Keepalive - Prevent GitHub from disabling scheduled workflows

on:
  schedule:
    # Раз в 50 дней (GitHub отключает cron после 60 дней без активности)
    - cron: '0 12 */50 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🏓 Keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow disabling [skip ci]"
          git push
